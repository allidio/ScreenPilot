<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Screen Pilot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      width: 360px;
      padding: 14px;
      color: #111;
      background: #ffffff;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 600;
    }

    /* Form Fields */
    .field {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      color: #333;
      font-weight: 500;
    }

    input#apiKeyInput {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #d0d7de;
      font-size: 13px;
    }

    input#apiKeyInput:focus {
      outline: none;
      border-color: #0366d6;
      box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.1);
    }

    /* Button Styles */
    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #c9d1d9;
      background: #f6f8fa;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #f3f6fb;
      border-color: #a3b3bf;
    }

    .btn.primary {
      background: #0366d6;
      color: #fff;
      border-color: #0356b6;
    }

    .btn.primary:hover {
      background: #0256c7;
    }

    .btn.danger {
      background: #ffdddd;
      border-color: #ff9b9b;
      color: #a71d5e;
    }

    .btn.danger:hover {
      background: #ffcccc;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Controls */
    .controls {
      margin-bottom: 12px;
    }

    /* Status and Info */
    .status {
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 0;
    }

    .shortcuts {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    kbd {
      background: #f1f1f1;
      border-radius: 4px;
      padding: 2px 6px;
      border: 1px solid #ddd;
      font-size: 11px;
      font-family: monospace;
    }

    /* Spinner Animation */
    .spinner {
      display: none;
      margin-bottom: 10px;
      color: #0366d6;
      font-weight: 600;
      font-size: 13px;
    }

    .spinner.active {
      display: block;
      animation: pulse 0.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Results Section */
    .result {
      background: #fff;
      border: 1px solid #eaecef;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .result.hidden {
      display: none;
    }

    .summary {
      font-size: 14px;
      margin-bottom: 8px;
      padding: 8px;
      background: #f6f8fa;
      border-radius: 4px;
      line-height: 1.5;
    }

    .summary.hidden {
      display: none;
    }

    .raw {
      background: #f6f8fa;
      padding: 8px;
      border-radius: 6px;
      max-height: 160px;
      overflow: auto;
      font-size: 11px;
      font-family: monospace;
      color: #24292e;
    }
  </style>
</head>
<body>
  <h2>Screen Pilot</h2>

  <div class="field">
    <label for="apiKeyInput">OpenAI API Key</label>
    <input id="apiKeyInput" type="password" placeholder="Enter your API key">
    <button id="saveKeyBtn" class="btn primary">Save</button>
  </div>

  <div class="controls">
    <button id="stopSpeak" class="btn danger" style="display:none">Stop Speaking</button>
  </div>

  <div id="status" class="status">Status: <span id="statusText">Idle</span></div>
  <div class="shortcuts">Shortcuts: Hold <kbd>Space</kbd> to record; release to stop. <kbd>Esc</kbd> stops speaking.</div>

  <div id="spinner" class="spinner" aria-hidden="true"><span id="spinnerText">Listening…</span></div>

  <div id="result" class="result hidden">
    <div id="summary" class="summary hidden"></div>
    <pre id="raw" class="raw"></pre>
  </div>
