<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>AI Screen Navigator</title></head>
<body>
  <h2>AI Screen Navigator</h2>

  <div class="field">
    <label for="apiKeyInput">OpenAI API Key</label>
    <input id="apiKeyInput" type="password" placeholder="Enter your API key">
    <button id="saveKeyBtn" class="btn primary">Save</button>
  </div>

  <div class="controls">
    <button id="stopSpeak" class="btn danger" style="display:none">Stop Speaking</button>
  </div>

  <div id="status" class="status">Status: <span id="statusText">Idle</span></div>
  <div class="shortcuts">Shortcuts: Hold <kbd>Space</kbd> to record; release to stop. <kbd>Esc</kbd> stops speaking.</div>

  <div id="spinner" class="spinner" aria-hidden="true"><span id="spinnerIcon"></span> <span id="spinnerText">Listening…</span></div>

  <div id="result" class="result" style="display:none">
    <div id="summary" class="summary" style="display:none"></div>
    <pre id="raw" class="raw"></pre>
  </div>

  <style>
    body{font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; width:360px; padding:14px; color:#111}
    h2{margin:0 0 10px 0}
    .field{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    label{font-size:13px;color:#333}
    input#apiKeyInput{flex:1;padding:8px;border-radius:6px;border:1px solid #d0d7de}
    .controls{margin-bottom:12px}
    .btn{padding:8px 12px;border-radius:6px;border:1px solid #c9d1d9;background:#f6f8fa;cursor:pointer}
    .btn.primary{background:#0366d6;color:#fff;border-color:#0356b6}
    .btn.secondary{background:#e6eef8}
    .btn.danger{background:#ffdddd;border-color:#ff9b9b}
    .btn:disabled{opacity:0.6;cursor:not-allowed}
    .status{margin-bottom:6px;font-weight:600}
    .shortcuts{font-size:12px;color:#666;margin-bottom:8px}
    kbd{background:#f1f1f1;border-radius:4px;padding:2px 6px;border:1px solid #ddd}
    .spinner{display:none;margin-bottom:10px;color:#0366d6;font-weight:600}
    .spinner .spin{display:inline-block;animation:spin 1s linear infinite}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .result{background:#fff;border:1px solid #eaecef;padding:10px;border-radius:8px}
    .summary{font-size:14px;margin-bottom:8px}
    .raw{background:#f6f8fa;padding:8px;border-radius:6px;max-height:160px;overflow:auto}
  </style>

  <script src="popup.js"></script>
</body>
</html>
